name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2

      - name: Markdown, Mermaid, and doc links
        run: flox activate -- bash scripts/check-docs.sh

      - name: Budgets, shellcheck, and actionlint
        run: flox activate -- bash scripts/check-hygiene.sh

      - name: Whitespace and yaml
        run: flox activate -- bash scripts/check-whitespace.sh

  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2

      - name: Format, types, build, and tests
        run: flox activate -- bash scripts/check-node.sh
