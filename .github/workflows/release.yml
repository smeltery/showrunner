name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2

      - name: Validate release tag
        run: flox activate -- bash scripts/validate-release-tag.sh

      - name: Markdown, Mermaid, and doc links
        run: flox activate -- bash scripts/check-docs.sh

      - name: Budgets, shellcheck, and actionlint
        run: flox activate -- bash scripts/check-hygiene.sh

      - name: Whitespace and yaml
        run: flox activate -- bash scripts/check-whitespace.sh

      - name: Format, types, build, and tests
        run: flox activate -- bash scripts/check-node.sh

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2

      - name: Pack the library
        run: flox activate -- bash scripts/pack-release.sh

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: flox activate -- bash scripts/publish-package.sh

      - name: Publish to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist-release/showrunner-*.tgz
            dist-release/SHA256SUMS

  verify-assets:
    name: verify release assets
    needs: publish
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2

      - name: Confirm expected assets
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          flox activate -- bash scripts/verify-release-assets.sh
          flox activate -- bash scripts/verify-package.sh
